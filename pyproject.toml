[project]
name = "onco-radiomap-agent"
version = "1.3.2"
description = "Traceable human-evidence assessment for tumor-radiopharmaceutical pairs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pydantic==2.13.4", "scikit-learn==1.9.0", "numpy==2.4.6", "python-dotenv==1.2.3"]

[project.optional-dependencies]
live = ["openai==3.3.1"]
retrieval = ["networkx==3.6.1", "nano-vectordb==0.0.4.3", "lightrag-hku==1.5.6", "openai==3.3.1", "tiktoken==0.14.0", "transformers==5.15.1"]
test = ["pytest==9.1.1"]

[project.scripts]
onco-radiomap = "onco_radiomap_agent.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onco_radiomap_agent = ["resources/*.csv", "resources/*.json", "resources/prompts/entity_type/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
